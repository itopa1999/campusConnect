services:

  db:
    image: postgres:16
    container_name: campusconnect_db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: campusconnect_redis
    restart: unless-stopped

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: campusconnect_api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "4",
        "--threads",
        "2",
        "--timeout",
        "120",
        "backend.wsgi:application"
      ]


  nginx:
    image: nginx:alpine
    container_name: campusconnect_nginx
    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "8080:80"

    volumes:
      - ./nginx/campusconnect.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro


  celery:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: campusconnect_celery
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./media:/app/media

    command:
      celery -A backend worker --loglevel=info --concurrency=4


  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: campusconnect_celery_beat
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    volumes:
      - .:/app
      - ./logs:/app/logs

    command:
      celery -A backend beat -l info


volumes:
  postgres_data:
  redis_data: