<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CampusConnect UI · Password Reset</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #1a2c2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    :root {
      --accent: #2c7a5e;
      --accent-light: #eaf7f0;
      --accent-dark: #1f5e48;
      --card-border: #eef2f0;
      --text-muted: #5a6e6f;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    opacity: 2;
    }

    .card {
      background: #fff;
      border-radius: 2rem;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
      max-width: 520px;
      width: 100%;
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.2rem;
      font-size: 3rem;
    }

    .icon.success { color: var(--accent); }
    .icon.error { color: #dc3545; }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    h1.success { color: var(--accent-dark); }
    h1.error { color: #b91c2c; }

    .message {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dfe5e3;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(44,122,94,0.12);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 40px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
    }

    /* Notification */
    .notify {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 9999;
      min-width: 280px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      transition: 0.3s ease;
    }

    .notify.success {
      background: #eaf7f0;
      color: #1f5e48;
      border: 1px solid var(--accent);
    }

    .notify.error {
      background: #ffecec;
      color: #b91c2c;
      border: 1px solid #dc3545;
    }

    .hidden {
      opacity: 0;
      transform: translate(-50%, -20px);
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="particles-js"></div>

<!-- Notification -->
<div id="notify" class="notify hidden"></div>

<div class="card" data-aos="fade-up">

  {% if is_success %}

    <div class="icon success">
      <i class="fas fa-lock"></i>
    </div>

    <h1 class="success">Set New Password</h1>

    <p class="message">{{ message }}</p>

    <form id="resetForm">
      <input type="hidden" id="user_id" value="{{ data.user_id }}">
      <input type="hidden" id="email" value="{{ data.email }}">

      <div class="form-group">
        <input type="password" id="password" placeholder="New Password" required>
      </div>

      <div class="form-group">
        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Update Password
      </button>
    </form>

  {% else %}

    <div class="icon error">
      <i class="fas fa-times-circle"></i>
    </div>

    <h1 class="error">Reset Failed</h1>

    <p class="message">{{ message }}</p>

  {% endif %}

</div>

<!-- Scripts -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
  AOS.init({ duration: 700, once: true, offset: 20 });

  // Subtle particles background (matches main site)
  if (typeof particlesJS !== 'undefined') {
    particlesJS('particles-js', {
      particles: {
        number: { value: 40, density: { enable: true, value_area: 800 } },
        color: { value: '#2c7a5e' },
        shape: { type: 'circle' },
        opacity: { value: 0.25, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#2c7a5e', opacity: 0.15, width: 1 },
        move: { enable: true, speed: 1, direction: 'none', random: false, straight: false, out_mode: 'out' }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true }
      },
      retina_detect: true
    });
  }

function showNotify(message, type) {
  const notify = document.getElementById("notify");
  notify.textContent = message;
  notify.className = `notify ${type}`;

  setTimeout(() => {
    notify.classList.add("hidden");
  }, 3500);
}

document.getElementById("resetForm")?.addEventListener("submit", async function(e) {
  e.preventDefault();

  const userId = document.getElementById("user_id").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirm_password").value;

  if (password !== confirmPassword) {
    showNotify("Passwords do not match", "error");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Processing...";

  try {
    const res = await fetch("/user/api/auth/confirm-reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}"
      },
      body: JSON.stringify({
        user_id: userId,
        email: email,
        password: password,
        confirm_password: confirmPassword
      })
    });

    const data = await res.json();

    if (res.ok) {
      showNotify("Password updated successfully. Confirmation email sent.", "success");
    } else {
      showNotify(data.message || "Reset failed", "error");
    }

  } catch (err) {
    showNotify("Network error. Try again.", "error");
  } finally {
    btn.disabled = false;
    btn.textContent = "Update Password";
  }
});

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + "=")) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

const csrftoken = getCookie("csrftoken");
</script>

</body>
</html>
